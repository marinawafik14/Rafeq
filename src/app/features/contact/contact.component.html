

<!-- Contact Section -->
<section class="contact-section py-5">
  <div class="container">
    <div class="row align-items-start justify-content-between g-5">
      
      

      <!-- Right Side - Info & FAQ -->
      <div class="col-md-5">
        <!-- Headline -->
        <h2 class="mb-5 fw-bold">We're Here for You</h2>
        <p class="text-muted mb-5">
          Have questions or need help? Reach out — we'd love to hear from you!
        </p>

        <!-- Alternative Contact Methods -->
        <div class="contact-methods mb-4">
          <div class="d-flex align-items-start mb-5">
            <div class="me-3 d-flex align-items-center justify-content-center  rounded-circle text-white p-2 fs-5">
              <i class="fas fa-phone-alt"></i>
            </div>
            <div>
              <small class="text-muted d-block">Phone</small>
              <strong>+20 100 000 0000</strong>
            </div>
          </div>
          <div class="d-flex align-items-start mb-5">
            <div class="me-3 d-flex align-items-center justify-content-center  rounded-circle text-white p-2 fs-5">
              <i class="fas fa-envelope"></i>
            </div>
            <div>
              <small class="text-muted d-block">Email</small>
              <strong>support&#64;rafeeq.com</strong>
            </div>
          </div>
          <div class="d-flex align-items-start">
            <div class="me-3 d-flex align-items-center justify-content-center  rounded-circle text-white p-2 fs-5">
              <i class="fas fa-map-marker-alt"></i>
            </div>
            <div>
              <small class="text-muted d-block">Office</small>
              <strong>Cairo, Egypt</strong>
            </div>
          </div>
        </div>

      </div>
      <!-- Left Side - Contact Form -->
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h4 class="mb-4 fw-bold" style="color: #0a2e65;">Send Us a Message</h4>

          <!-- Contact Form -->
          <form  [formGroup]="contactForm" (ngSubmit)="submitForm()">
            <div class="mb-3">
              <label for="name" class="form-label">Your Name</label>
              <input type="text" class="form-control rounded-pill" id="name" formControlName="name"
                     placeholder="Enter your name">
              
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Your Email</label>
              <input type="email" class="form-control rounded-pill" id="email" formControlName="email"
                     placeholder="Enter your email">
              
            </div>

            <div class="mb-3">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" class="form-control rounded-pill" id="subject" formControlName="subject"
                     placeholder="Subject of your message">
              
            </div>

            <div class="mb-3">
              <label for="message" class="form-label">Your Message</label>
              <textarea id="message" class="form-control rounded-4" rows="5" formControlName="message"
                        placeholder="Tell us how we can assist you..."></textarea>
             
            </div>

            <button type="submit" class="btn btn-sub rounded-pill w-100 py-3 mt-3">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
