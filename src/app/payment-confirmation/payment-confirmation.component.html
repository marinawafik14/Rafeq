<div class="container text-center my-5">
  <i class="fas fa-check-circle fa-5x text-success mb-3"></i>
  <h1 class="display-5 fw-bold mb-4 payment-succ">Payment Successful!</h1>
  <p class="lead text-muted mb-4">Your session has been confirmed.</p>

  <!-- Booking Details -->
  <div class="card shadow-sm border-0 rounded-4 p-4 mx-auto" style="max-width: 500px;">
    <h5 class="fw-bold mb-3 session-det">Session Details</h5>
    <ul class="list-unstyled text-start">
      <li class="mb-2"><strong>Mentor:</strong> {{ bookingDetails.mentorName }}</li>
      <li class="mb-2"><strong>Time:</strong> {{ bookingDetails.sessionDateTime | date:'full' }}</li>
      <li class="mb-2"><strong>Amount Paid:</strong> {{ bookingDetails.amountPaid }} EGP</li>
      <!-- <li class="mb-2"><strong>Google Meet Link:</strong></li> -->
    </ul>
    <div class="alert alert-warning d-flex align-items-center justify-content-center gap-2 py-2 px-3 mb-3" style="font-size: 1.1rem; border-radius: 1rem;">
      <i class="bi bi-clock-history me-2" style="font-size: 1.5rem;"></i>
      <span class="fw-semibold">The meeting link will be available soon.</span>
    </div>
