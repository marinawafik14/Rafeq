<header class="header shadow-sm">
  <nav class="navbar navbar-expand-lg navbar-light bg-white">
    <div class="container">
      <!-- Brand -->
      <a class="navbar-brand d-flex align-items-center" routerLink="/home">
        <i class="fas fa-users me-2 fa-lg"></i>
        <span class="fw-bold">Rafeeq</span>
      </a>

      <!-- Toggler -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Nav Links & Buttons -->
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav mb-2 mb-lg-0">
          <li class="nav-item mx-2">
            <a class="nav-link rounded-pill px-3" routerLink="/home" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }">
              Home
            </a>
          </li>
          <li class="nav-item mx-2">
            <a class="nav-link rounded-pill px-3" routerLink="/find-mentors" routerLinkActive="active">
              Find Mentors
            </a>
          </li>
          <li class="nav-item mx-2">
            <a class="nav-link rounded-pill px-3" routerLink="/about" routerLinkActive="active">
              About Us
            </a>
          </li>

          <li class="nav-item mx-2">
            <a class="nav-link rounded-pill px-3" routerLink="/contact" routerLinkActive="active">
              Contact
            </a>
          </li>


          <li class="nav-item mx-2" *ngIf="currentUser">
            <a class="nav-link rounded-pill px-3" routerLink="/user-profile" routerLinkActive="active">
              My Profile
            </a>
          </li>
          <!--  
             <li class="nav-item mx-2">
            <a class="nav-link rounded-pill px-3" routerLink="/messages" routerLinkActive="active">
        
          <i class="fa-brands fa-rocketchat fa-xl" ></i>
            </a>
        
          </li>
        -->
        <li class="nav-item mx-2" *ngIf="currentUser?.role === 'Mentee'">
  <a class="nav-link rounded-pill px-3" routerLink="/messages" routerLinkActive="active">
    <i class="fa-brands fa-rocketchat fa-xl"></i>
  </a>
</li>



          <!-- AI Assistant Link - Shown only for logged-in users -->
          <li class="nav-item mx-2" *ngIf="currentUser">
            <a class="nav-link rounded-pill px-3 ai-assistant-card" routerLink="/ai-chatbot" routerLinkActive="active">
              <i class="fas fa-robot ai-assistant-icon"></i>
              <span class="ai-assistant-text">AI Assistant</span>
            </a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <!-- Notification Badge - Show only for logged-in users -->
          <app-notification-badge *ngIf="currentUser"></app-notification-badge>

          <div class="d-flex gap-2">
            <ng-container *ngIf="!currentUser">
              <button class="btn btn-login" routerLink="/login">Log In</button>
              <button class="btn btn-sign" routerLink="/register">Sign Up</button>
            </ng-container>

            <ng-container *ngIf="currentUser">
              <span class="navbar-text me-2 d-none d-lg-block">
                Welcome, {{ currentUser.fullName }}
              </span>
              <button class="btn btn-logout" (click)="logout()">Log Out</button>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
