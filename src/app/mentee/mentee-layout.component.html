<!-- Mentee Layout Wrapper -->
<div class="mentee-layout container-fluid px-0">
  <!-- Modern top navbar for mentee area -->

  
  <div class="row g-0">
    <!-- Sidebar -->
    <aside class="col-12 col-md-3 col-lg-2 mentee-sidebar" [class.open]="sidebarOpen">
      <div class="sidebar-inner h-100 d-flex flex-column">
        <div class="sidebar-header p-3 ">
          <div class="d-flex flex-column  w-100 mb-2">
            <div style="width:35px;height:3px;background-color:white;margin:6px 0; cursor:pointer;"(click)="toggleSidebar()"></div>
            <div style="width:35px;height:3px;background-color:white;margin:6px 0; cursor:pointer;"(click)="toggleSidebar()"></div>
            <div style="width:35px;height:3px;background-color:white;margin:6px 0;cursor:pointer;" (click)="toggleSidebar()"></div>
          </div>
        </div>
        
        <div class="sidebar-profile p-3 text-center">

          <div class="profile-info">
            <div class="fw-bold">{{ menteeName || 'Mentee' }}</div>
            <div class="small" *ngIf="menteeId">ID: {{ menteeId }}</div>
          </div>
        </div>
        
        <div class="sidebar-menu flex-grow-1">
          <ul class="nav flex-md-column flex-row w-100 justify-content-between">
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center py-2 px-2" [routerLink]="['/mentee', menteeId, 'dashboard']">
                <i class="bi bi-house me-2"></i> <span class="d-none d-md-inline">Dashboard</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center py-2 px-2" [routerLink]="['/mentee', menteeId, 'bookings']">
                <i class="bi bi-calendar-check me-2"></i> <span class="d-none d-md-inline">Bookings</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center py-2 px-2" [routerLink]="['/mentee', menteeId, 'search-mentors']">
                <i class="bi bi-search me-2"></i> <span class="d-none d-md-inline">Find Mentors</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center py-2 px-2" [routerLink]="['/mentee', menteeId, 'cv-management']">
                <i class="bi bi-file-earmark-person me-2"></i> <span class="d-none d-md-inline">CV Management</span>
              </a>
            </li>
          </ul>
        </div>
        
        <div class="sidebar-footer p-3 d-flex flex-column align-items-center">
          
          <button class="btn btn-danger w-75 mt-2" (click)="logout()" style="display:block;margin:0 auto;">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
        </div>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="col" [class.sidebar-collapsed]="!sidebarOpen">
      <div class="main-content-container">
        <ng-content></ng-content>
      </div>
    </main>
  </div>
</div>
