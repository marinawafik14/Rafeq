<div class="dashboard-page">
  <main class="main-content">
    <div class="container-fluid py-4">
      <!-- Hero Section -->
      <div class="hero-section">
        <div class="hero-content">
          <div class="hero-text">
            <h1 class="hero-title">
              <span class="greeting">Welcome back,</span>
              <span class="name">{{menteeName || 'Mentee'}}!</span>
            </h1>
            <p class="hero-subtitle" *ngIf="menteeName; else loadingGreeting">
              <i class="bi bi-rocket-takeoff me-2"></i>
              Ready to accelerate your learning journey?
            </p>
            <ng-template #loadingGreeting>
              <div class="loading-skeleton">
                <div class="skeleton-line"></div>
              </div>
            </ng-template>
          </div>
          <div class="hero-decoration">
            <div class="floating-icons">
              <i class="bi bi-lightbulb icon-float"></i>
              <i class="bi bi-graph-up-arrow icon-float"></i>
              <i class="bi bi-trophy icon-float"></i>
            </div>
          </div>
        </div>
      </div>
  <!-- Quick Actions -->
      <div class="quick-actions-section">
        <h3 class="section-title">Quick Actions</h3>
        <div class="actions-grid">
          <button class="action-card" (click)="navigateToSearchMentors()">
            <div class="action-icon">
              <i class="bi bi-search"></i>
            </div>
            <div class="action-content">
              <h4>Find Mentors</h4>
              <p>Discover and connect with expert mentors</p>
            </div>
          </button>
          
          <button class="action-card" (click)="navigateToCVManagement()">
            <div class="action-icon">
              <i class="bi bi-file-earmark-text"></i>
            </div>
            <div class="action-content">
              <h4>CV Management</h4>
              <p>Upload and manage your resume</p>
            </div>
          </button>

          <button class="action-card" (click)="navigateToMessages()">
            <div class="action-icon">
              <i class="bi bi-chat-dots"></i>
            </div>
            <div class="action-content">
              <h4>Messages</h4>
              <p>Chat with your mentors and support</p>
            </div>
          </button>

          <button class="action-card" (click)="navigateToAIAssistant()">
            <div class="action-icon">
              <i class="bi bi-robot"></i>
            </div>
            <div class="action-content">
              <h4>AI Career Assistant</h4>
              <p>Get personalized career guidance</p>
            </div>
          </button>

          <button class="action-card" (click)="navigateToBookings()">
            <div class="action-icon">
              <i class="bi bi-calendar-event"></i>
            </div>
            <div class="action-content">
              <h4>Bookings</h4>
              <p>View and manage your session bookings</p>
            </div>
          </button>
        </div>
      </div>
      <!-- Stats Grid - 3 cards in one row -->
             <h3 class="section-title">Bookings Stats</h3>

      <div class="stats-grid">
        <div class="stat-card" *ngFor="let stat of stats; trackBy: trackByStat" [class.loading]="isLoading">
          <div class="stat-icon-wrapper" [style.background]="stat.color">
            <i class="bi {{stat.icon}} stat-icon"></i>
          </div>
          <div class="stat-content">
            <div class="stat-value">{{isLoading ? '...' : stat.value}}</div>
            <div class="stat-label">{{stat.label}}</div>
          </div>
        </div>
      </div>    
    </div>
  </main>
</div>
