<div class="forgot-password-wrapper">
  <div class="forgot-password-container">
    <!-- Left side - Image -->
    <div class="forgot-password-image-section">
      <div class="forgot-password-image-container">
        <img src="/images/forgetPass.jpg" alt="Reset Your Password" class="forgot-password-image">
        <div class="forgot-password-image-overlay">
          <div class="forgot-password-image-content">

          </div>
        </div>
      </div>
    </div>

    <!-- Right side - Form -->
    <div class="forgot-password-form-section">
      <div class="forgot-password-form-container">
        <div class="forgot-password-header">
          <h2>Forgot Your Password</h2>
        </div>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgot-password-form">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" formControlName="email" class="form-control"
              placeholder="Enter your email address" />
            @if(email?.invalid && (email?.dirty || email?.touched)) {
            <div class="error-message">
              @if(email?.errors?.['required']){
              <span>Email is required.</span>
              } @if(email?.errors?.['email']){
              <span>Invalid email format.</span>
              }
            </div>
            }
          </div>

          <button type="submit" class="btn btn-primary" [disabled]="forgotPasswordForm.invalid">
            <span>Send Reset Link</span>
          </button>
        </form>

        <div class="forgot-password-links">
          <p class="back-to-login">
            Remember your password?
            <a routerLink="/login" class="login-link">Sign In</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
