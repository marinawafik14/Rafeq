<div class="card review-card shadow-sm border-0 p-3 mb-3">
  <div class="d-flex align-items-center mb-2">
    <img src="/images/photo-1494790108377-be9c29b29330.avif" alt="User Avatar" class="rounded-circle me-3" width="40" height="40">
    <div>
      <h6 class="mb-0 fw-bold">Ahmed Mohamed</h6>
      <small class="text-muted">{{ '2025-06-01' | date:'mediumDate' }}</small>
    </div>
  </div>

  <app-rating-stars [rating]="5"></app-rating-stars>

  <p class="mt-2 text-muted">
    "The mock interview session was incredibly helpful. The feedback helped me improve my responses significantly."
  </p>

  <div class="d-flex mt-auto">
    <span class="me-3">
      <i class="fas fa-thumbs-up text-success me-1"></i> 12
    </span>
    <span>
      <i class="far fa-comment-dots text-info me-1"></i> 2 Comments
    </span>
  </div>
</div>
