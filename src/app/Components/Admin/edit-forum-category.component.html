<!-- Admin Edit Forum Category - Unified Design -->
<div class="admin-header py-4 mb-4" style="background: linear-gradient(90deg, #0a2e65 60%, #1e4a8a 100%); color: #fff;">
  <div class="container">
    <h1 class="fw-bold mb-1">Edit Forum Category</h1>
    <p class="mb-0">Update the details of this forum category</p>
  </div>
</div>

<div class="container mb-5">
  <div class="card shadow-sm rounded-4 p-4">
    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="name" class="form-label fw-semibold">Category Name <span class="text-danger">*</span></label>
        <input id="name" type="text" formControlName="name" class="form-control" [class.is-invalid]="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched" maxlength="50" placeholder="Enter category name">
        <div *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched" class="invalid-feedback">
          Name is required and must be less than 50 characters.
        </div>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label fw-semibold">Description</label>
        <textarea id="description" formControlName="description" class="form-control" rows="3" maxlength="200" placeholder="Optional: Describe this category"></textarea>
        <div *ngIf="categoryForm.get('description')?.invalid && categoryForm.get('description')?.touched" class="invalid-feedback">
          Description must be less than 200 characters.
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-secondary rounded-pill px-4" (click)="onCancel()" [disabled]="loading">
          <i class="fas fa-times me-1"></i> Cancel
        </button>
        <button type="submit" class="btn btn-primary rounded-pill px-4" [disabled]="categoryForm.invalid || loading">
          <i class="fas fa-save me-1"></i> Update Category
        </button>
      </div>
    </form>
  </div>
</div>
