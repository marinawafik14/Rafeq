<div class="admin-contact-container">
  <div class="messages-list">
    <div class="messages-list-header">
      <h3 class="messages-title">Messages</h3>
      <div class="search-box">
        <input type="text" [(ngModel)]="searchText" (input)="applySearch()" placeholder="Search by name..."
          class="search-input" />
      </div>
    </div>

    <ul>
      <li *ngFor="let msg of filteredMessages" (click)="selectMessage(msg)"
        [class.active]="selectedMessage?.email === msg.email">
        <div class="avatar">
          <img src="/images/userimage.jpg" alt="User Avatar">
        </div>
        <div class="message-info">
          <strong>{{ msg.name || msg.email }}</strong>
          <p class="last-message-snippet">{{ msg.subject }}</p>
        </div>
        <div class="message-time-and-status">
          <span class="timestamp" *ngIf="msg.createdAt">
            {{ msg.createdAt | date:'short' }}
          </span>


          <span class="unread-badge" *ngIf="msg.status !== 'Read'">1</span>

        </div>
      </li>
    </ul>
  </div>

  <div class="chat-window" *ngIf="selectedMessage">
    <div class="chat-header">
      <h4>{{ selectedMessage.name || selectedMessage.email }}</h4>
    </div>

    <div class="chat-box">
      <div *ngFor="let item of chatItems"
        [ngClass]="{'chat-bubble': true, 'admin': item.sender === 'admin', 'user': item.sender === 'mentee'}">
        <p>{{ item.text }}</p>
        <div class="bubble-footer">
          <span class="timestamp">{{ item.createdAt | date:'short' }}</span>
          <span class="read-receipt" *ngIf="item.sender === 'admin' && item.read">
            <i class="fas fa-check"></i> read
          </span>
        </div>
      </div>
    </div>

    <form [formGroup]="replyForm" (ngSubmit)="sendReply()" class="reply-form">
      <input formControlName="replyText" type="text" placeholder="Type a message..." />
      <button type="submit" [disabled]="replyForm.invalid">
        <i class="fas fa-paper-plane"></i>
      </button>
    </form>
  </div>
</div>
