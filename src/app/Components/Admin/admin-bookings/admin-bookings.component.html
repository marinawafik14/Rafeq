<div class="p-4">
  <!-- Header -->
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-md-between mb-4 gap-3">
    <div>
      <h1 class="h4 fw-semibold">Bookings</h1>
      <p class="text-muted">Manage and oversee all bookings</p>
    </div>
    
  </div>

  <!-- Search & Filters -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
    <input [(ngModel)]="searchQuery" (ngModelChange)="currentPage = 1"
      class="form-control w-100 w-md-50" placeholder="Search mentors or mentees">

    <div class="d-flex flex-wrap gap-2">
      <select [(ngModel)]="StatusFilter" (ngModelChange)="currentPage = 1" class="form-select">
        <option value="">Status</option>
        <option value="Pending">Pending</option>
        <option value="Cancelled">Cancelled</option>
        <option value="Completed">Completed</option>
        <option value="Confirmed">Confirmed</option>
      </select>

      <select [(ngModel)]="paymentStatusFilter" (ngModelChange)="currentPage = 1" class="form-select">
        <option value="">All Payment Statuses</option>
        <option value="Unpaid">Unpaid</option>
        <option value="Paid">Paid</option>
      </select>
      <select [(ngModel)]="dateSort" class="form-select" style="max-width:150px;display:inline-block;">
  <option value="newest">Newest</option>
  <option value="oldest">Oldest</option>
</select>
    </div>
  </div>

  <!-- Table -->
  <div class="table-responsive bg-white rounded shadow-sm">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Session Type</th>
          <th>Mentor</th>
          <th>Mentee</th>
          <th>Status</th>
          <th>Total Amount</th>
          <th>Commission</th>
          <th>Payment Status</th>
           <!--
          <th>Start At</th>
          <th>End At</th>
       
          <th>Google Meet Link</th>
        -->
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let booking of getpaginatedBookings()">
          <td>{{ booking.sessionType }}</td>
          <td>{{ booking.mentorName }}</td>
          <td>{{ booking.menteeName }}</td>
          <td>
            <span [ngClass]="{
              'text-success': booking.status === 'completed',
              'text-primary': booking.status === 'confirmed' || booking.status === 'Pending',
              'text-danger': booking.status === 'cancelled'
            }">
              {{ booking.status}}
            </span>
          </td>
          <td class="text-success fw-medium">{{ booking.totalAmount }} EGP</td>
          <td>{{ booking.commission }}</td>
          <td>{{ booking.paymentStatus }}</td>
         <!-- 
          <td class="text-primary">{{ booking.startDateTime }}</td>
          <td class="text-primary">{{ booking.endDateTime }}</td>
           
          <td>
            <a *ngIf="booking.googleMeetLink" [href]="booking.googleMeetLink" target="_blank" class="text-primary text-decoration-underline">Join Meeting</a>
            <span *ngIf="!booking.googleMeetLink" class="text-muted">No Link</span>
          </td>
        -->
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div *ngIf="totalPages >= 1" class="d-flex justify-content-center mt-4">
    <nav>
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="changePage(currentPage - 1)">‹</button>
        </li>
        <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index"
          [class.active]="i + 1 === currentPage">
          <button class="page-link" (click)="changePage(i + 1)">{{ i + 1 }}</button>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="changePage(currentPage + 1)">›</button>
        </li>
      </ul>
    </nav>
  </div>
</div>
