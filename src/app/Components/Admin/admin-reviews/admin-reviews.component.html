<div class="mentor-reviews-container container-fluid">

    <div class="main-content mx-auto mt-8 px-4">
        <h1 class="text-center mb-4">Mentor Reviews</h1>

        <div *ngIf="reviewsList" class="text-center text-muted py-4">
            Loading reviews...
        </div>

        <div *ngIf="error" class="text-center text-danger py-4">
            {{ error }}
        </div>

        <div *ngIf="!loading && !error && reviewsList.length === 0" class="text-center text-muted py-4">
            No reviews found.
        </div>

        <div *ngIf="!loading && !error && reviewsList.length > 0" class="reviews-list">

            <div *ngFor="let review of reviewsList" class="review-card mb-4 p-4">
                <div class="review-header d-flex justify-content-between align-items-start mb-3">
                    <div class="user-info d-flex align-items-center flex-grow-1">

                        <div class="profile-pic-placeholder me-3">

                            <i class="fas fa-user text-muted"></i>
                        </div>
                        <div>
                            <div class="names mb-1">
                                <span class="mentor-name font-semibold">Mentor: {{ review.reviewerName || 'N/A'
                                    }}</span>,
                                <span class="mentee-name font-semibold">Mentee: {{ review.reviewedUserName || 'N/A'
                                    }}</span>
                            </div>
                            <div class="review-meta text-sm text-gray-500">
                                <span class="reviewer-name font-medium">{{ review.reviewedUserName || 'N/A' }}</span>
                                <span class="review-date ms-2 italic">{{ formatDate(review.createdAt.toString())
                                    }}</span>
                            </div>
                        </div>
                    </div>
                    <button class="delete-button btn btn-danger btn-sm rounded-lg"
                        (click)="deleteReview(review.reviewId)">Delete</button>
                </div>
                <div class="review-body ps-5">
                    <div class="rating mb-2">
                        <!-- Filled stars -->
                        <span *ngFor="let i of getStarArray(review.rating)"
                            class="star filled text-warning">&#9733;</span>
                        <!-- Empty stars -->
                        <span *ngFor="let i of getStarArray(5 - (review.rating || 0))"
                            class="star text-gray-300">&#9733;</span>
                    </div>
                    <p class="comment text-gray-700 leading-relaxed">{{ review.comment || 'No comment provided.' }}</p>
                </div>
                <div class="review-actions d-flex gap-4 ps-5 text-gray-600 text-sm">
                    <span class="action-item d-flex items-center">
                        <i class="fas fa-thumbs-up me-1 text-gray-500"></i>
                    </span>
                    <span class="action-item d-flex items-center">
                        <i class="fas fa-comment me-1 text-gray-500"></i>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
