<div class="card p-4 mb-4 shadow-sm border-0 rounded-4 mx-auto" style="max-width: 600px;">
  <h4 class="fw-bold mb-3 text-gradient">Add New User</h4>
  <form (ngSubmit)="onSave()" #userForm="ngForm">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <label class="form-label">Full Name</label>
        <input class="form-control rounded-pill" [(ngModel)]="newUser.fullName" name="fullName" required>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Email</label>
        <input class="form-control rounded-pill" [(ngModel)]="newUser.email" name="email" required>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Password</label>
        <input class="form-control rounded-pill" [(ngModel)]="newUser.PasswordHash" name="PasswordHash" type="password" required>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Profile Picture</label>
        <input type="file" class="form-control rounded-pill" (change)="onFileSelected($event)" accept="image/*">
        <div *ngIf="imagePreview" class="mt-2">
          <img [src]="imagePreview" alt="Preview" class="img-thumbnail" style="max-width: 120px;">
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">Bio</label>
        <textarea class="form-control rounded-3" [(ngModel)]="newUser.bio" name="bio" rows="2"></textarea>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Role</label>
        <select class="form-select rounded-pill" [(ngModel)]="newUser.role" name="roleName" required>
          <option value="admin">Admin</option>
          <option value="mentor">Mentor</option>
          <option value="mentee">Mentee</option>
        </select>
      </div>
      <div class="col-12 col-md-6 d-flex align-items-center gap-3">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" [(ngModel)]="newUser.isMentor" name="isMentor" id="isMentor">
          <label class="form-check-label" for="isMentor">Is Mentor</label>
        </div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" [(ngModel)]="newUser.isInterviewer" name="isInterviewer" id="isInterviewer">
          <label class="form-check-label" for="isInterviewer">Is Interviewer</label>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Hourly Rate</label>
        <input class="form-control rounded-pill" type="number" step="0.01" [(ngModel)]="newUser.hourlyRate" name="hourlyRate">
      </div>
    </div>
    <div class="mt-4 d-flex justify-content-end gap-2">
      <button type="submit" class="btn btn-primary px-4 rounded-pill">Save</button>
      <button type="button" class="btn btn-secondary px-4 rounded-pill" (click)="onCancel()">Cancel</button>
    </div>
  </form>
</div>
