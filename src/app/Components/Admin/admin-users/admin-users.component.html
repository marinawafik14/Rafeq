<div class="container my-4">
  <!-- Header -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
    <div>
      <h2 class="fw-bold mb-1 text-gradient">Users</h2>
      <p class="text-muted mb-0">Manage users and their roles</p>
    </div>
    <button class="btn btn-primary new-user px-4 py-2 rounded-pill shadow-sm" (click)="showAddUserForm = true">
      <i class="bi bi-person-plus me-2"></i> New user
    </button>
  </div>

  <!-- Add User Form -->
  <app-add-user *ngIf="showAddUserForm" (save)="saveNewUser($event)" (cancel)="showAddUserForm = false"></app-add-user>

  <!-- Filters -->
  <div class="row g-2 mb-3 align-items-center">
    <div class="col-12 col-md-4">
      <div class="input-group shadow-sm rounded-pill">
        <span class="input-group-text bg-white border-0"><i class="bi bi-search text-primary"></i></span>
        <input [(ngModel)]="searchQuery" (ngModelChange)="currentPage =1"
          class="form-control border-0 rounded-end-pill py-2"
          placeholder="Search users by name, email">
      </div>
    </div>
    <div class="col-12 col-md-4">
      <select class="form-select rounded-pill shadow-sm" [(ngModel)]="roleFilter">
        <option value="">Role</option>
        <option value="Mentor">Mentor</option>
        <option value="Mentee">Mentee</option>
      </select>
    </div>
    <div class="col-12 col-md-4">
      <select class="form-select rounded-pill shadow-sm" [(ngModel)]="dateSort">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
      </select>
    </div>
  </div>

  <!-- Users Table -->
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table align-middle table-hover mb-0">
          <thead class="table-primary">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of getpaginatedUsers">
              <td class="fw-semibold">{{user.fullName}}</td>
              <td><span class="text-primary">{{ user.email }}</span></td>
              <td><span class="badge bg-secondary text-white px-3 py-2 rounded-pill">{{user.role}}</span></td>
              <td>
                <button
                  class="btn btn-outline-success btn-sm action-btn me-2 rounded-pill"
                  style="min-width: 110px"
                  *ngIf="!user.isActive"
                  (click)="updateUserStatus(user.id, true)">
                  <i class="bi bi-check-circle me-1"></i> Activate
                </button>
                <button
                  class="btn btn-outline-secondary btn-sm action-btn me-2 rounded-pill"
                  style="min-width: 110px"
                  *ngIf="user.isActive"
                  (click)="updateUserStatus(user.id, false)">
                  <i class="bi bi-x-circle me-1"></i> Deactivate
                </button>
              </td>
              <td><span class="text-primary">{{ user.createdAt | date:'short' }}</span></td>
              <td>
                <a
                  class="btn btn-outline-primary btn-sm action-btn me-2 rounded-pill"
                  style="min-width: 110px"
                  [routerLink]="['edit-user/',user.id]">
                  <i class="bi bi-pencil"></i> Edit
                </a>
                <button
                  class="btn btn-outline-danger btn-sm action-btn rounded-pill"
                  style="min-width: 110px"
                  (click)="deleteUser(user.id)">
                  <i class="bi bi-trash"></i> Delete
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <nav class="mt-4" *ngIf="totalPages >= 1">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <a class="page-link rounded-pill" (click)="changePage(currentPage - 1)">‹</a>
      </li>
      <li *ngFor="let page of [].constructor(totalPages); let i = index"
          class="page-item" [class.active]="i + 1 === currentPage">
        <a class="page-link rounded-pill" (click)="changePage(i + 1)">{{ i + 1 }}</a>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <a class="page-link rounded-pill" (click)="changePage(currentPage + 1)">›</a>
      </li>
    </ul>
  </nav>
</div>
